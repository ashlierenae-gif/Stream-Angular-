<div class="stream-details container">
    <img class="socialmedia-picture" src="{{currentSocial().imageURL || '/medialogo/instagramlogo.png'}}"
        style="height: 200px; width:200px; object-fit:cover; border-radius: 12px;">
    <div class="text-details text-center">
        <h3>{{currentSocial().title}}</h3>
        <div><span> </span>{{currentSocial().description}}</div>

        <div class="mt-3">
            <a class="btn" style="background-color: #2a1f1b; color:white;" [href]="currentSocial().link"
                target="_blank">Visit {{currentSocial().title}}</a>
        </div>
    </div>
</div>
