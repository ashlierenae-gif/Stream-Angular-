<div class="stream-details container">
     <h2 style="font-family: 'Orbitron', sans-serif; font-weight: 800; color: #6B2D9E;">Ashlie After Hours</h2>
    <img class="socialmedia-picture" src="{{currentSocial().imageURL || '/medialogo/instagramlogo.jpg'}}"
        style="height: 200px; width:200px; object-fit:cover; border-radius: 12px;">
    <div class="text-details text-center">
        <h3>{{currentSocial().title}}</h3>
        <div><span> </span>{{currentSocial().description}}</div>

        <div class="mt-3">
            <a class="btn" style="background-color: #2a1f1b; color:white;" [href]="currentSocial().link"
                target="_blank">Visit {{currentSocial().title}}</a>
        </div>
        <div class="mt-2 d-flex justify-content-center gap-2">
            <a class="btn btn-secondary" [routerLink]="['/socialMedia', socialMediaID, 'edit']">Edit</a>
            <button class="btn btn-danger" (click)="deletePlatform()">Delete</button>

        </div>
