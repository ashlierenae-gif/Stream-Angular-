<div class="container text-center">
    <h2>Ashlie After Hours</h2>
    <p class="lead mb-4">Add a new platform</p>

    <div class="mx-auto" style="max-width: 500px;">
        <form [formGroup]="newPlatform">
            <label for="title">Title:</label>
            <input id="title" class="form-control mb-3" formControlName="title" type="text" required>

            <label for="description">Description: </label>
            <input id="description" class="form-control mb-3" formControlName="description" type="text" required>

            <label for="logo"> Logo:</label>
            <select id="logo" class="form-control mb-3" formControlName="imageURL">
                <option value="/ui/medialogo/youtube.jpg">YouTube</option>
                <option value="/ui/medialogo/instagramlogo.jpg">Instagram</option>
                <option value="/ui/medialogo/twitchlogo.jpg">Twitch</option>
                <option value="/ui/medialogo/tiktoklogo.jpg">Tiktok</option>

            </select>

            <label for="link">Link: </label>
            <input id="link" class="form-control mb-3" formControlName="link" type="text" required>

        </form>

        <div class="text-center mt-3">
            <button class="btn btn-primary" (click)="createPlatform()">Add</button>
        </div>
